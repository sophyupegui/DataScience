<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Premac · Registro de Actividades</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --c-bg:#F7F6F2;
  --c-surface:#FFFFFF;
  --c-surface2:#F0EFE9;
  --c-border:#E2E0D8;
  --c-border2:#CCCAC0;
  --c-text:#1A1917;
  --c-text2:#6B6960;
  --c-text3:#9C9A91;
  --c-accent:#1A4B8C;
  --c-accent-light:#E8EFF9;
  --c-green:#0D6B4F;
  --c-green-light:#E3F4EE;
  --c-amber:#7A4A08;
  --c-amber-light:#FBF0DC;
  --c-red:#8B1F1F;
  --c-red-light:#FAEAEA;
  --c-purple:#432FA0;
  --c-purple-light:#EDEAFC;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--c-bg);color:var(--c-text);font-size:15px;line-height:1.5}

/* ---- HEADER ---- */
.top-bar{background:var(--c-text);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:28px;height:28px;background:var(--c-accent);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:16px;height:16px;fill:#fff}
.logo-name{font-size:14px;font-weight:600;letter-spacing:0.02em}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:0.04em;text-transform:uppercase}
.date-pill{font-family:'DM Mono',monospace;font-size:11px;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px;color:rgba(255,255,255,0.7)}

/* ---- SCREEN SYSTEM ---- */
.screen{display:none;animation:fadeIn 0.2s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- WELCOME ---- */
.welcome{max-width:480px;margin:0 auto;padding:32px 20px}
.welcome-title{font-size:22px;font-weight:600;margin-bottom:6px}
.welcome-sub{color:var(--c-text2);font-size:14px;margin-bottom:28px}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--c-text3);margin-bottom:10px}
.rep-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.rep-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);cursor:pointer;transition:all 0.15s;text-align:left;width:100%}
.rep-btn:hover{border-color:var(--c-border2);box-shadow:var(--shadow);transform:translateY(-1px)}
.rep-btn:active{transform:none}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.rep-info .rname{font-size:14px;font-weight:500;color:var(--c-text)}
.rep-info .rzone{font-size:12px;color:var(--c-text3)}
.zone-group{margin-bottom:18px}
.zone-title{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--c-text3);padding:0 4px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.zone-title::after{content:'';flex:1;height:0.5px;background:var(--c-border)}

.dir-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--c-accent-light);border:1px solid var(--c-accent);border-radius:var(--radius);cursor:pointer;transition:all 0.15s;width:100%;color:var(--c-accent);font-weight:500;font-size:14px}
.dir-btn:hover{background:#dce8f7}

/* ---- LOG SCREEN ---- */
.log-screen{max-width:560px;margin:0 auto;padding:20px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--c-text2);cursor:pointer;margin-bottom:20px;background:none;border:none;padding:0;font-family:inherit}
.back-btn:hover{color:var(--c-text)}
.rep-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.rep-header .avatar{width:44px;height:44px;font-size:14px}
.rep-header h2{font-size:18px;font-weight:600}
.rep-header p{font-size:13px;color:var(--c-text2)}

.day-summary{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px}
.day-summary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day-summary-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--c-text3)}
.day-total{font-size:13px;font-weight:600;color:var(--c-accent);font-family:'DM Mono',monospace}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.no-acts{font-size:13px;color:var(--c-text3);font-style:italic}

.pick-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--c-text3);margin-bottom:10px}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:20px}
.act-card{border:0.5px solid var(--c-border);border-radius:var(--radius);padding:11px 12px;cursor:pointer;transition:all 0.15s;background:var(--c-surface)}
.act-card:hover{border-color:var(--c-border2);box-shadow:var(--shadow)}
.act-card.sel{border-width:1.5px;box-shadow:var(--shadow)}
.act-emoji{font-size:18px;margin-bottom:5px}
.act-name{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:2px}
.act-desc{font-size:10px;color:var(--c-text3);line-height:1.4}

.form-card{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}
.form-card h3{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--c-text2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--c-text2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:0.5px solid var(--c-border2);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--c-text);background:var(--c-bg);transition:border-color 0.15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--c-accent)}
.field textarea{resize:vertical;min-height:70px}
.mins-row{display:flex;gap:6px;align-items:center}
.mins-row input{width:90px;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;text-align:center}
.qbtn{border:0.5px solid var(--c-border2);background:var(--c-surface2);border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--c-text2);font-family:'DM Sans',sans-serif;transition:all 0.12s}
.qbtn:hover{background:var(--c-border);color:var(--c-text)}
.save-btn{width:100%;padding:13px;background:var(--c-accent);color:#fff;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.15s;letter-spacing:0.01em}
.save-btn:hover{opacity:0.9}
.save-btn:active{opacity:0.8;transform:scale(0.99)}

.log-list{display:flex;flex-direction:column;gap:8px}
.log-item{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.log-body{flex:1}
.log-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.log-act-name{font-size:13px;font-weight:600}
.log-mins{font-size:12px;font-family:'DM Mono',monospace;color:var(--c-text2)}
.log-client{font-size:12px;color:var(--c-accent);margin-top:2px}
.log-note{font-size:12px;color:var(--c-text2);margin-top:3px}
.log-time{font-size:11px;color:var(--c-text3);font-family:'DM Mono',monospace}
.del-x{background:none;border:none;cursor:pointer;color:var(--c-text3);font-size:13px;padding:0;line-height:1;margin-top:1px}
.del-x:hover{color:var(--c-red)}
.empty-msg{text-align:center;padding:24px;color:var(--c-text3);font-size:13px}

/* ---- DIRECTOR VIEW ---- */
.dir-screen{max-width:680px;margin:0 auto;padding:20px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.stat-box{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-n{font-size:24px;font-weight:600;color:var(--c-text);font-family:'DM Mono',monospace}
.stat-l{font-size:11px;color:var(--c-text3);margin-top:3px}
.rep-card{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:13px 15px;margin-bottom:8px}
.rc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rc-name{font-size:13px;font-weight:600;flex:1}
.rc-zone{font-size:11px;color:var(--c-text3)}
.rc-hrs{font-size:12px;font-family:'DM Mono',monospace;color:var(--c-text2)}
.mini-bars{display:flex;gap:3px;height:10px}
.mini-bar{height:10px;border-radius:2px;min-width:4px}
.rc-empty{font-size:12px;color:var(--c-text3);font-style:italic}
.dist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-top:12px}
.dist-card{background:var(--c-surface);border:0.5px solid var(--c-border);border-radius:var(--radius);padding:11px;text-align:center}
.dist-emoji{font-size:20px;margin-bottom:4px}
.dist-name{font-size:11px;font-weight:600;color:var(--c-text2);margin-bottom:4px;line-height:1.3}
.dist-val{font-size:17px;font-weight:600;font-family:'DM Mono',monospace}
.dist-pct{font-size:11px;color:var(--c-text3)}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--c-text2)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--c-text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

@media(max-width:480px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .act-grid{grid-template-columns:repeat(2,1fr)}
  .top-bar{padding:12px 16px}
  .welcome,.log-screen,.dir-screen{padding:16px}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16"><path d="M8 1L15 5V11L8 15L1 11V5L8 1Z"/></svg>
    </div>
    <div>
      <div class="logo-name">Premac</div>
      <div class="logo-sub">Registro de Actividades</div>
    </div>
  </div>
  <div class="date-pill" id="date-pill"></div>
</div>

<!-- SCREEN 1: BIENVENIDA / SELECCIÓN -->
<div class="screen active" id="screen-welcome">
  <div class="welcome">
    <div class="welcome-title">¿Quién eres?</div>
    <div class="welcome-sub">Selecciona tu nombre para registrar tus actividades del día.</div>
    <div id="rep-groups"></div>
    <button class="dir-btn" onclick="goDirector()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="currentColor" opacity="0.4"/></svg>
      Vista directiva — Sara Zuluaga
    </button>
  </div>
</div>

<!-- SCREEN 2: REGISTRO -->
<div class="screen" id="screen-log">
  <div class="log-screen">
    <button class="back-btn" onclick="goWelcome()">← Volver</button>
    <div class="rep-header">
      <div class="avatar" id="log-avatar"></div>
      <div><h2 id="log-name"></h2><p id="log-zone"></p></div>
    </div>

    <div class="day-summary" id="day-summary"></div>

    <div class="pick-label">Selecciona la actividad</div>
    <div class="act-grid" id="act-grid"></div>

    <div class="form-card" id="form-card" style="display:none">
      <h3 id="form-title"></h3>
      <div class="field">
        <label>Minutos dedicados</label>
        <div class="mins-row">
          <input type="number" id="inp-mins" min="5" max="480" step="5" value="30"/>
          <button class="qbtn" onclick="addQ(15)">+15</button>
          <button class="qbtn" onclick="addQ(30)">+30</button>
          <button class="qbtn" onclick="addQ(60)">+1h</button>
        </div>
      </div>
      <div class="field">
        <label>Cliente / empresa <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--c-text3)">(opcional)</span></label>
        <input type="text" id="inp-client" placeholder="Ej: Vanti, Ecopetrol, Colgas…"/>
      </div>
      <div class="field">
        <label>Nota breve <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--c-text3)">(qué hiciste, resultado)</span></label>
        <textarea id="inp-note" placeholder="Ej: Llamada de seguimiento cotización reguladores. Cliente confirma interés, enviar propuesta esta semana."></textarea>
      </div>
      <button class="save-btn" onclick="saveLog()">Guardar registro</button>
    </div>

    <div class="pick-label" id="logs-label" style="display:none">Registrado hoy</div>
    <div class="log-list" id="log-list"></div>
  </div>
</div>

<!-- SCREEN 3: DIRECTORA -->
<div class="screen" id="screen-dir">
  <div class="dir-screen">
    <button class="back-btn" onclick="goWelcome()">← Volver</button>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      <div class="avatar" style="width:44px;height:44px;font-size:14px;background:#E8EFF9;color:#1A4B8C;font-weight:600">SZ</div>
      <div><h2 style="font-size:18px;font-weight:600">Vista directiva</h2><p style="font-size:13px;color:var(--c-text2)">Resumen del equipo — hoy</p></div>
    </div>
    <div class="stats-row" id="dir-stats"></div>
    <div class="pick-label">Por vendedor</div>
    <div class="legend-row" id="dir-legend"></div>
    <div id="dir-reps"></div>
    <div id="dir-dist-wrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TODAY_KEY = new Date().toISOString().slice(0,10);
const TODAY_LABEL = new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.getElementById('date-pill').textContent = TODAY_LABEL;

// ── DATA ──────────────────────────────────────────────────────────────────────
const BASE_ACTS = [
  {id:'visita',name:'Visita cliente',desc:'Reunión presencial',icon:'🤝',color:'#0D6B4F',bg:'#E3F4EE',dot:'#1D9E75'},
  {id:'llamada',name:'Llamada comercial',desc:'Seguimiento o prospección',icon:'📞',color:'#1A4B8C',bg:'#E8EFF9',dot:'#378ADD'},
  {id:'cotizacion',name:'Cotización / oferta',desc:'Preparar y enviar propuesta',icon:'📋',color:'#3B6D11',bg:'#EAF3DE',dot:'#639922'},
  {id:'demo',name:'Demo / capacitación',desc:'Demostración de producto',icon:'🔧',color:'#7A4A08',bg:'#FBF0DC',dot:'#EF9F27'},
  {id:'estrategia',name:'Estrategia comercial',desc:'Táctica bimensual asignada',icon:'🎯',color:'#432FA0',bg:'#EDEAFC',dot:'#7F77DD'},
  {id:'admin',name:'Tareas admin',desc:'CRM, reportes, correos',icon:'💻',color:'#4A4A44',bg:'#F0EFE9',dot:'#888780'},
  {id:'desplazamiento',name:'Desplazamiento',desc:'Tiempo en ruta / transporte',icon:'🚗',color:'#7A2A10',bg:'#FAEAEA',dot:'#D85A30'},
  {id:'reunion',name:'Reunión interna',desc:'Reuniones de equipo',icon:'👥',color:'#432FA0',bg:'#EDEAFC',dot:'#7F77DD'},
  {id:'prospectacion',name:'Prospectación',desc:'Búsqueda de nuevos clientes',icon:'🔍',color:'#8B1F5A',bg:'#FBEAF0',dot:'#D4537E'},
  {id:'cobranza',name:'Seguimiento cobranza',desc:'Gestión de cartera y recaudo',icon:'💰',color:'#8B1F1F',bg:'#FAEAEA',dot:'#E24B4A'},
  {id:'capacitacion',name:'Capacitación propia',desc:'Formación y lectura técnica',icon:'📚',color:'#0C447C',bg:'#E8EFF9',dot:'#185FA5'},
];
const ACT_PV   = {id:'atencion_pv',name:'Atención punto de venta',desc:'Servicio en mostrador',icon:'🏪',color:'#0D6B4F',bg:'#E3F4EE',dot:'#1D9E75'};
const ACT_BIC  = {id:'bicicletas',name:'Bicicletas',desc:'Gestión canal bicicletas',icon:'🚲',color:'#8B1F1F',bg:'#FAEAEA',dot:'#E24B4A'};

const GROUPS = [
  {
    label:'Ejecutivos Bogotá',
    reps:[
      {id:'clareth',name:'Clareth',zone:'Ejecutiva Bogotá',color:'#3B6D11',bg:'#EAF3DE',ini:'CL',acts:BASE_ACTS},
      {id:'laura',  name:'Laura',  zone:'Ejecutiva Bogotá',color:'#0D6B4F',bg:'#E3F4EE',ini:'LA',acts:BASE_ACTS},
    ]
  },
  {
    label:'Ejecutivos Regiones',
    reps:[
      {id:'med',name:'Ejecutivo Medellín',  zone:'Medellín',       color:'#1A4B8C',bg:'#E8EFF9',ini:'ME',acts:BASE_ACTS},
      {id:'cal',name:'Ejecutivo Cali',      zone:'Cali',           color:'#7A4A08',bg:'#FBF0DC',ini:'CA',acts:BASE_ACTS},
      {id:'cos',name:'Ejecutivo Costa',     zone:'Costa',          color:'#7A2A10',bg:'#FAEAEA',ini:'CO',acts:BASE_ACTS},
      {id:'vdc',name:'Ejecutivo V. Caldas', zone:'Valle de Caldas',color:'#432FA0',bg:'#EDEAFC',ini:'VC',acts:BASE_ACTS},
    ]
  },
  {
    label:'Canal Rinnai',
    reps:[
      {id:'carolina',name:'Carolina',zone:'Rep. Rinnai',color:'#8B1F5A',bg:'#FBEAF0',ini:'CR',acts:BASE_ACTS},
      {id:'ricardo', name:'Ricardo', zone:'Rep. Rinnai',color:'#8B1F1F',bg:'#FAEAEA',ini:'RI',acts:BASE_ACTS},
    ]
  },
  {
    label:'Ventas Internas',
    reps:[
      {id:'alejandra_c',name:'Alejandra Castro',zone:'Asesora Ventas Internas',color:'#0C447C',bg:'#E8EFF9',ini:'AC',acts:[...BASE_ACTS,ACT_PV]},
      {id:'maria_i',    name:'María Isabel',    zone:'Asesora Ventas Internas',color:'#432FA0',bg:'#EDEAFC',ini:'MI',acts:[...BASE_ACTS,ACT_BIC]},
    ]
  },
  {
    label:'Desarrollo de Mercado',
    reps:[
      {id:'mkt',name:'Market Developer',zone:'Desarrollo de Mercado',color:'#8B1F5A',bg:'#FBEAF0',ini:'MD',acts:BASE_ACTS},
    ]
  },
];

const ALL_REPS = GROUPS.flatMap(g=>g.reps);
const ALL_ACTS = [...BASE_ACTS, ACT_PV, ACT_BIC];

// ── STORAGE ───────────────────────────────────────────────────────────────────
function loadLogs(){try{return JSON.parse(localStorage.getItem('premac_v3')||'{}')}catch{return{}}}
function saveLogs(l){try{localStorage.setItem('premac_v3',JSON.stringify(l))}catch{}}
let LOGS = loadLogs();
function getTodayLogs(repId){return((LOGS[repId]||{})[TODAY_KEY]||[])}
function addRep(repId,entry){
  if(!LOGS[repId])LOGS[repId]={};
  if(!LOGS[repId][TODAY_KEY])LOGS[repId][TODAY_KEY]=[];
  LOGS[repId][TODAY_KEY].push(entry);
  saveLogs(LOGS);
}
function deleteEntry(repId,eid){
  if(LOGS[repId]&&LOGS[repId][TODAY_KEY]){
    LOGS[repId][TODAY_KEY]=LOGS[repId][TODAY_KEY].filter(e=>e.id!==eid);
    saveLogs(LOGS);
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmtMin(m){m=parseInt(m)||0;if(m<60)return m+'min';const h=Math.floor(m/60),r=m%60;return r?h+'h '+r+'min':h+'h'}
function totalMin(logs){return logs.reduce((s,l)=>s+(parseInt(l.mins)||0),0)}
function nowTime(){return new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function uid(){return Date.now()+'_'+Math.random().toString(36).slice(2,6)}

// ── NAV ───────────────────────────────────────────────────────────────────────
let currentRep = null;
let selectedAct = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function goWelcome(){renderWelcome();showScreen('welcome')}
function goDirector(){renderDirector();showScreen('dir')}
function goRep(rep){currentRep=rep;selectedAct=null;renderLog();showScreen('log')}

// ── WELCOME ───────────────────────────────────────────────────────────────────
function renderWelcome(){
  const wrap=document.getElementById('rep-groups');
  wrap.innerHTML='';
  GROUPS.forEach(g=>{
    const gDiv=document.createElement('div');
    gDiv.className='zone-group';
    gDiv.innerHTML=`<div class="zone-title">${g.label}</div>`;
    g.reps.forEach(rep=>{
      const logs=getTodayLogs(rep.id);
      const m=totalMin(logs);
      const btn=document.createElement('button');
      btn.className='rep-btn';
      btn.innerHTML=`<div class="avatar" style="background:${rep.bg};color:${rep.color}">${rep.ini}</div>
        <div class="rep-info"><div class="rname">${rep.name}</div><div class="rzone">${rep.zone}${m>0?' · <strong>'+fmtMin(m)+'</strong> hoy':''}</div></div>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;color:#ccc"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      btn.onclick=()=>goRep(rep);
      gDiv.appendChild(btn);
    });
    wrap.appendChild(gDiv);
  });
}

// ── LOG SCREEN ────────────────────────────────────────────────────────────────
function renderLog(){
  const rep=currentRep;
  document.getElementById('log-avatar').style.cssText=`background:${rep.bg};color:${rep.color};font-weight:600;font-size:14px;width:44px;height:44px`;
  document.getElementById('log-avatar').textContent=rep.ini;
  document.getElementById('log-name').textContent=rep.name;
  document.getElementById('log-zone').textContent=rep.zone;
  renderDaySummary();
  renderActGrid();
  renderFormCard();
  renderLogList();
}

function renderDaySummary(){
  const logs=getTodayLogs(currentRep.id);
  const m=totalMin(logs);
  const actMin={};
  logs.forEach(l=>{actMin[l.actId]=(actMin[l.actId]||0)+(parseInt(l.mins)||0)});
  const ds=document.getElementById('day-summary');
  let inner=`<div class="day-summary-header"><div class="day-summary-title">Resumen de hoy</div><div class="day-total">${m>0?fmtMin(m):'0 min'}</div></div>`;
  if(logs.length===0){
    inner+=`<div class="no-acts">Aún no hay actividades registradas hoy</div>`;
  } else {
    inner+=`<div class="chips">`;
    currentRep.acts.filter(a=>actMin[a.id]).forEach(a=>{
      inner+=`<div class="chip" style="background:${a.bg};color:${a.color}">${a.name}: ${fmtMin(actMin[a.id])}</div>`;
    });
    inner+=`</div>`;
  }
  ds.innerHTML=inner;
}

function renderActGrid(){
  const grid=document.getElementById('act-grid');
  grid.innerHTML='';
  currentRep.acts.forEach(a=>{
    const sel=selectedAct&&selectedAct.id===a.id;
    const div=document.createElement('div');
    div.className='act-card'+(sel?' sel':'');
    if(sel){div.style.borderColor=a.color;div.style.background=a.bg;}
    div.innerHTML=`<div class="act-emoji">${a.icon}</div>
      <div class="act-name" style="${sel?'color:'+a.color:''}">${a.name}</div>
      <div class="act-desc">${a.desc}</div>`;
    div.onclick=()=>{
      selectedAct=(selectedAct&&selectedAct.id===a.id)?null:a;
      renderActGrid();renderFormCard();
    };
    grid.appendChild(div);
  });
}

function renderFormCard(){
  const fc=document.getElementById('form-card');
  if(!selectedAct){fc.style.display='none';return;}
  fc.style.display='block';
  fc.style.borderColor=selectedAct.color;
  document.getElementById('form-title').innerHTML=`${selectedAct.icon} ${selectedAct.name}`;
  document.getElementById('form-title').style.color=selectedAct.color;
  document.getElementById('inp-mins').value=30;
  document.getElementById('inp-client').value='';
  document.getElementById('inp-note').value='';
  fc.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderLogList(){
  const logs=getTodayLogs(currentRep.id);
  const list=document.getElementById('log-list');
  const label=document.getElementById('logs-label');
  label.style.display=logs.length?'block':'none';
  list.innerHTML='';
  [...logs].reverse().forEach(log=>{
    const act=currentRep.acts.find(a=>a.id===log.actId)||{name:log.actId,dot:'#888',icon:'·'};
    const div=document.createElement('div');
    div.className='log-item';
    div.innerHTML=`<div class="log-dot" style="background:${act.dot}"></div>
      <div class="log-body">
        <div class="log-top">
          <div class="log-act-name">${act.icon} ${act.name}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="log-mins">${fmtMin(log.mins)}</div>
            <button class="del-x" onclick="delLog('${log.id}')">✕</button>
          </div>
        </div>
        ${log.client?`<div class="log-client">${log.client}</div>`:''}
        ${log.note?`<div class="log-note">${log.note}</div>`:''}
        <div class="log-time">${log.time}</div>
      </div>`;
    list.appendChild(div);
  });
}

function addQ(n){const el=document.getElementById('inp-mins');el.value=Math.min(480,(parseInt(el.value)||0)+n)}
function saveLog(){
  if(!selectedAct)return;
  const mins=parseInt(document.getElementById('inp-mins').value)||30;
  const client=document.getElementById('inp-client').value.trim();
  const note=document.getElementById('inp-note').value.trim();
  addRep(currentRep.id,{id:uid(),actId:selectedAct.id,mins,client,note,time:nowTime()});
  selectedAct=null;
  renderDaySummary();renderActGrid();renderFormCard();renderLogList();
  toast('✓ Actividad guardada — '+fmtMin(mins));
  window.scrollTo({top:0,behavior:'smooth'});
}
function delLog(eid){
  deleteEntry(currentRep.id,eid);
  renderDaySummary();renderLogList();
  toast('Registro eliminado');
}

// ── DIRECTOR VIEW ─────────────────────────────────────────────────────────────
function renderDirector(){
  let totalReg=0,totalM=0,activos=0;
  const actTotal={};
  ALL_REPS.forEach(rep=>{
    const logs=getTodayLogs(rep.id);
    const m=totalMin(logs);
    if(logs.length)activos++;
    totalReg+=logs.length;totalM+=m;
    logs.forEach(l=>{actTotal[l.actId]=(actTotal[l.actId]||0)+(parseInt(l.mins)||0)});
  });
  const topEntry=Object.entries(actTotal).sort((a,b)=>b[1]-a[1])[0];
  const topName=topEntry?ALL_ACTS.find(a=>a.id===topEntry[0])?.name||'—':'—';

  document.getElementById('dir-stats').innerHTML=`
    <div class="stat-box"><div class="stat-n">${activos}</div><div class="stat-l">Vendedores activos</div></div>
    <div class="stat-box"><div class="stat-n">${totalReg}</div><div class="stat-l">Actividades registradas</div></div>
    <div class="stat-box"><div class="stat-n">${fmtMin(totalM)}</div><div class="stat-l">Tiempo total equipo</div></div>
    <div class="stat-box"><div class="stat-n" style="font-size:13px;padding-top:6px">${topName}</div><div class="stat-l">Actividad dominante</div></div>`;

  const legEl=document.getElementById('dir-legend');
  legEl.innerHTML='';
  BASE_ACTS.slice(0,6).forEach(a=>{
    legEl.innerHTML+=`<div class="leg-item"><div class="leg-dot" style="background:${a.dot}"></div>${a.name}</div>`;
  });

  const repsEl=document.getElementById('dir-reps');
  repsEl.innerHTML='';
  ALL_REPS.forEach(rep=>{
    const logs=getTodayLogs(rep.id);
    const m=totalMin(logs);
    const actMap={};
    logs.forEach(l=>{actMap[l.actId]=(actMap[l.actId]||0)+(parseInt(l.mins)||0)});
    const maxM=480;const bw=200;
    let bars='';
    Object.entries(actMap).forEach(([aid,am])=>{
      const act=ALL_ACTS.find(a=>a.id===aid);
      const w=Math.max(5,Math.round((am/maxM)*bw));
      bars+=`<div class="mini-bar" style="width:${w}px;background:${act?.dot||'#888'}" title="${act?.name||aid}: ${fmtMin(am)}"></div>`;
    });
    repsEl.innerHTML+=`<div class="rep-card">
      <div class="rc-top">
        <div class="avatar" style="width:30px;height:30px;font-size:11px;background:${rep.bg};color:${rep.color};font-weight:600">${rep.ini}</div>
        <div class="rc-name">${rep.name} <span class="rc-zone">${rep.zone}</span></div>
        <div class="rc-hrs">${logs.length} reg · ${fmtMin(m)}</div>
      </div>
      ${bars?`<div class="mini-bars">${bars}</div>`:`<div class="rc-empty">Sin registros hoy</div>`}
    </div>`;
  });

  const distWrap=document.getElementById('dir-dist-wrap');
  if(totalM>0){
    let dhtml=`<div class="pick-label" style="margin-top:20px">Distribución del equipo</div><div class="dist-grid">`;
    ALL_ACTS.filter(a=>actTotal[a.id]).sort((a,b)=>(actTotal[b.id]||0)-(actTotal[a.id]||0)).forEach(a=>{
      const pct=Math.round((actTotal[a.id]/totalM)*100);
      dhtml+=`<div class="dist-card" style="border-color:${a.color}">
        <div class="dist-emoji">${a.icon}</div>
        <div class="dist-name" style="color:${a.color}">${a.name}</div>
        <div class="dist-val" style="color:${a.color}">${fmtMin(actTotal[a.id])}</div>
        <div class="dist-pct">${pct}% del tiempo</div>
      </div>`;
    });
    dhtml+=`</div>`;
    distWrap.innerHTML=dhtml;
  } else {
    distWrap.innerHTML='';
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderWelcome();
</script>
</body>
</html>
